{% extends 'base.html' %}
{% load static %}

{% block title %}Recipe List{% endblock %}

{% block page_title %}All Recipes{% endblock %}

{% block content %}
    <ul>
        {% for recipe in object_list %} 
            <li>
                <a href="{{ recipe.get_absolute_url }}">{{ recipe.name }}</a>
            </li>
            {% empty %}
                <li>No recipes listed.</li>
        {% endfor %}
    </ul>
{% endblock %}
