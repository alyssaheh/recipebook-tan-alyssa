{% extends 'base.html' %}

{% block content %}
    <ul>
        {% for recipe in recipes %} 
            <li>
                <a href="{% url 'ledger:recipe_detail' recipe.pk %}">{{ recipe.name }}</a>
            </li>
            {% empty %}
                <li>No recipes listed.</li>
        {% endfor %}
    </ul>
{% endblock %}
