{% extends 'base.html' %}

{% block content %}
    <ul>
        <b>Name: {{name}},</b>
        <br>
        Ingredients:
        <ul>
            {% for ingredient in ingredients %}
                <li>name: {{ ingredient.name }} <br>
                quantity: {{ ingredient.quantity }}</li>
            {% endfor %}
        </ul>
    </ul>
{% endblock %}
