{% extends 'base.html' %}

{% block title %}Confirm Password Reset{% endblock %}
{% block page_title %}Confirm Password Reset{% endblock %}

{% block content %}
    {% if validlink %}
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Change Password</button>
        </form>
    {% else %}
        <p>Invalid password reset link!</p>
    {% endif %}
{% endblock %}
